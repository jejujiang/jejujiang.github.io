<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最最简易 · 你好</title>
    <!-- 极简风格：没有多余样式，只有最基础的居中可读性 -->
    <style>
        /* 保证文字在页面中自然居中，不引入复杂布局 */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        h1 {
            font-weight: 400;
            color: #1a1a1a;
            font-size: 2rem;
            letter-spacing: 1px;
            padding: 0.5em 1em;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }
        /* 一点轻微悬停趣味，但依然保持最简单 */
        h1:hover {
            background: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body>
    <!-- 整个页面只有一行文字，没有多余元素 -->
    <h1>✨ 你好，世界</h1>
</body>
</html>
