---
layout: default
---
<header class="masthead">
  <h1 class="masthead-title">
    <a href="{{ site.baseurl }}/"><span style="font-family: 'Bonheur Royale', cursive; font-size: 1.9rem; color: #520;">{{ site.name }} </span><span>&#39;s Café</span></a>
  </h1>
  <nav class="masthead-nav">
    {% for nav in site.nav %}
      {% if nav.remote %}
      <a href="{{ nav.href }}">{{ nav.name }}</a>
      {% else %}
      <a href="{{ site.baseurl }}/{{ nav.localpath }}">{{ nav.name }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>

<ul class="menu-list">
  <li>
    {% for coffee in site.coffees %}
    <div class="menu-item">
      <span class="item-name">{{ coffee.name }}</span>
      <span class="item-price">{{ coffee.price }}</span>
    </div>
    <div class="item-desc">{{ coffee.desc }}</div>
    <hr>
    {% endfor %}
  </li>
</ul>
